services:
  - type: web
    name: agroalerta-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps --include=dev --no-audit --no-fund && npx --no-install prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: EXPONER_TOKEN_VERIFICACION
        value: "false"
      - key: VERIFICACION_AUTOMATICA
        value: "true"
      - key: FRONTEND_URL
        value: "https://agroalerta-sv-beta.vercel.app"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DUI_PEPPER
        sync: false
      - key: CORS_ORIGINS
        sync: false
