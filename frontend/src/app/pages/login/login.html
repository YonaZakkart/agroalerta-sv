<app-auth-shell>
  <form novalidate (submit)="enviar($event)">
    <div class="form-group">
      <label for="correo">Correo electrónico</label>
      <input id="correo" name="correo" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
    </div>
    <div class="form-group">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn-primary">Iniciar sesión</button>
  </form>
</app-auth-shell>
