<app-auth-shell>
  <form novalidate (submit)="enviar($event)">
    <div class="form-grid">
      <div class="form-group">
        <label for="nombres">Nombres</label>
        <input id="nombres" name="nombres" type="text" autocomplete="given-name">
      </div>
      <div class="form-group">
        <label for="apellidos">Apellidos</label>
        <input id="apellidos" name="apellidos" type="text" autocomplete="family-name">
      </div>
      <div class="form-group full">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
      </div>
      <div class="form-group full">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" autocomplete="new-password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label for="dui">DUI (sin guiones)</label>
        <input id="dui" name="dui" type="text" inputmode="numeric" maxlength="9" autocomplete="off"
          placeholder="000000000">
      </div>
      <div class="form-group">
        <label for="distrito">Distrito (Morazán)</label>
        <input id="distrito" name="distrito" type="text" autocomplete="off" placeholder="Ej. Chilanga">
      </div>
    </div>
    <button type="submit" class="btn-primary">Crear cuenta</button>
  </form>
</app-auth-shell>
